apiVersion: apps/v1
kind: Deployment
metadata:
  name: serenity-client
  namespace: serenity-dev
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-serenity-dev-serenity-client
spec:
  replicas: 1
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-serenity-dev-serenity-client
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 50%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: serenity-client
        workload.user.cattle.io/workloadselector: apps.deployment-serenity-dev-serenity-client
    spec:
      containers:
        - name: serenity-client
          image: ghcr.io/kmontes198910/serenity-client:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
      imagePullSecrets:
        - name: ghcr-secret
