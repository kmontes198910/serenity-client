apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serenity-client
  namespace: serenity-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - serenitybhs.com
      secretName: serenity-tls
  rules:
    - host: serenitybhs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serenity-client-service
                port:
                  number: 3000
